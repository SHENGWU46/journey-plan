# www.journey-plan.cn / journey-plan.cn —— 备案号悬挂页
#
# 面向中国大陆的服务器，域名需完成 ICP 备案与公安联网备案。
# 已备案域名要求：首页可访问，且底部同时悬挂 ICP 备案号与公安备案号，并链接工信部备案系统。
#
# 该站点只需一个静态页（放到 /var/www/icp/index.html），与后端互不干扰：
#   - 根路径返回静态页
#   - API 走子域名 api.journey-plan.cn（见 api.journey-plan.cn.conf）
#
# 页脚示例（备案号请换成自己的）：
#   © 2026 <站点名> | <省简称>ICP备<编号>号-1 | <省简称>公网安备<编号>号
#   其中 ICP 备案号链接到 https://beian.miit.gov.cn/

server {
    listen 80;
    server_name www.journey-plan.cn journey-plan.cn;
    root /var/www/icp;
    index index.html;
}
