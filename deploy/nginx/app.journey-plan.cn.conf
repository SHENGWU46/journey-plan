# H5 版移动端（uni-app 编译产物）静态托管
#
# 文件来源：journey-plan-app 执行 `npm run build:h5` 得到的 dist/build/h5/
# 部署位置：解压到 /var/www/h5（即 /var/www/h5/index.html 存在）
#
# ⚠️ 必须部署在「域名根」而不是子路径：
#    产物里的资源引用是绝对根路径（/assets/...、/static/...），
#    放到 /app/ 这类子路径下会全部 404。
server {
    listen 80;
    server_name app.journey-plan.cn;

    root /var/www/h5;
    index index.html;

    # uni-app H5 走 hash 路由，任何未命中的路径都回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物文件名带 hash，可安全长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 图标 / 底部导航图（static/ 原样复制过来的）
    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/app-h5.access.log;
    error_log  /var/log/nginx/app-h5.error.log;
}

# ────────────────────────────────────────────────────────────────
# 申请到 HTTPS 证书后（腾讯云免费 DV，域名填 app.journey-plan.cn），
# 把上面那段 listen 80 改成 301 跳转，并启用下面这段。
# 注意：证书必须单独申请，api.journey-plan.cn 那张不覆盖 app 子域。
