# api.journey-plan.cn —— 后端 API 反向代理
#
# 由 deploy/enable-https.sh 自动写入服务器的 /etc/nginx/conf.d/。
# 换环境时请替换域名与证书路径。
#
# 安全要点：uvicorn 只监听 127.0.0.1:8000，公网只暴露 80 / 443。

server {
    listen 80;
    server_name api.journey-plan.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.journey-plan.cn;

    ssl_certificate     /etc/nginx/ssl/api.journey-plan.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/api.journey-plan.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # AI 接口耗时较长，留足超时
    }
}
